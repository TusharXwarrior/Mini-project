services:
  - type: web
    name: edurisk-api
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_ORIGIN
        sync: false
      - key: ML_SERVICE_URL
        value: https://REPLACE-WITH-ML-SERVICE.onrender.com
  - type: web
    name: edurisk-ml
    runtime: python
    rootDir: ml-service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
  - type: web
    name: edurisk-web
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://REPLACE-WITH-BACKEND.onrender.com/api
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
